name: free disk
description: Remove preinstalled toolsets the build does not use, for room to build the workspace

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /
      shell: bash
