[workspace]
resolver = "2"
members = [
  "bonsai/sdk",
  "risc0/bigint2",
  "risc0/bigint2/methods",
  "risc0/binfmt",
  "risc0/build",
  "risc0/build_kernel",
  "risc0/cargo-risczero",
  "risc0/circuit/keccak",
  "risc0/circuit/keccak-sys",
  "risc0/circuit/recursion",
  "risc0/circuit/recursion-control-zkrs",
  "risc0/circuit/recursion-sys",
  "risc0/circuit/recursion-zkrs",
  "risc0/circuit/rv32im",
  "risc0/circuit/rv32im-sys",
  "risc0/core",
  "risc0/groth16",
  "risc0/groth16-sys",
  "risc0/povw",
  "risc0/povw/guests",
  "risc0/r0vm",
  "risc0/sys",
  "risc0/tools",
  "risc0/zkos/v1compat",
  "risc0/zkp",
  "risc0/zkvm",
  "risc0/zkvm/methods",
  "risc0/zkvm/platform",
  "risc0/zkvm/receipts",
  "rzup",
  "tools/hotbench",
  "website/doc-test/main",
  "xtask",
]

[workspace.metadata.release-version]
version = "3.1.0-rc.2"
lockstep = ["cargo-risczero", "risc0-r0vm", "risc0-zkvm"]

# The circuit crates move together: receipts from the new recursion circuit and Groth16 setup
# are not compatible with 3.0.x, which neither the packaged files nor the API show.
[workspace.metadata.release-version.pin]
risc0-circuit-keccak = "4.1.0"
risc0-circuit-keccak-sys = "4.1.0"
risc0-circuit-recursion = "4.1.0"
risc0-circuit-recursion-control-zkrs = "4.1.0"
risc0-circuit-recursion-sys = "4.1.0"
risc0-circuit-recursion-zkrs = "4.1.0"
risc0-circuit-rv32im = "4.1.0"
risc0-circuit-rv32im-sys = "4.1.0"

# The regenerated recursion circuit added fields to its generated layout structs, which were
# public but used nowhere outside the crate. The layout module is now crate-private. Remove this
# once 4.1.0 is the baseline.
[workspace.metadata.release-version.allow-breaking]
risc0-circuit-recursion = { from = "4.0.5", reason = "generated layout types gained fields and are now crate-private; nothing outside the crate used them" }

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://risczero.com/"
repository = "https://github.com/risc0/risc0/"

[workspace.dependencies]
bonsai-sdk = { version = "1.4.3", default-features = false, path = "bonsai/sdk" }
hotbench = { path = "tools/hotbench" }
metal = "0.29"
risc0-bigint2 = { version = "1.4.14", default-features = false, path = "risc0/bigint2" }
risc0-binfmt = { version = "3.0.6-rc.2", default-features = false, path = "risc0/binfmt" }
risc0-build = { version = "3.0.7-rc.2", default-features = false, path = "risc0/build" }
risc0-build-kernel = { version = "2.0.1", default-features = false, path = "risc0/build_kernel" }
risc0-circuit-keccak = { version = "4.1.0-rc.2", default-features = false, path = "risc0/circuit/keccak" }
risc0-circuit-keccak-sys = { version = "4.1.0-rc.2", default-features = false, path = "risc0/circuit/keccak-sys" }
risc0-circuit-recursion = { version = "4.1.0-rc.2", default-features = false, path = "risc0/circuit/recursion" }
risc0-circuit-recursion-control-zkrs = { version = "4.1.0-rc.2", default-features = false, path = "risc0/circuit/recursion-control-zkrs" }
risc0-circuit-recursion-sys = { version = "4.1.0-rc.2", default-features = false, path = "risc0/circuit/recursion-sys" }
risc0-circuit-recursion-zkrs = { version = "4.1.0-rc.2", default-features = false, path = "risc0/circuit/recursion-zkrs" }
risc0-circuit-rv32im = { version = "4.1.0-rc.2", default-features = false, path = "risc0/circuit/rv32im" }
risc0-circuit-rv32im-sys = { version = "4.1.0-rc.2", default-features = false, path = "risc0/circuit/rv32im-sys" }
risc0-core = { version = "3.0.2", default-features = false, path = "risc0/core" }
risc0-groth16 = { version = "3.0.6-rc.2", default-features = false, path = "risc0/groth16" }
risc0-groth16-sys = { version = "0.1.0", default-features = false, path = "risc0/groth16-sys" }
risc0-povw = { version = "0.4.4-rc.2", default-features = false, path = "risc0/povw" }
risc0-r0vm = { version = "3.1.0-rc.2", default-features = false, path = "risc0/r0vm" }
risc0-sys = { version = "1.5.1-rc.2", default-features = false, path = "risc0/sys" }
risc0-zkos-v1compat = { version = "2.2.3", path = "risc0/zkos/v1compat" }
risc0-zkp = { version = "3.0.6-rc.2", default-features = false, path = "risc0/zkp" }
risc0-zkvm = { version = "3.1.0-rc.2", default-features = false, path = "risc0/zkvm" }
risc0-zkvm-platform = { version = "2.2.3", default-features = false, path = "risc0/zkvm/platform" }
rzup = { version = "0.5.2", default-features = false, path = "rzup" }
sppark = "0.1.12"

[profile.bench]
lto = true

# Always optimize; otherwise tests take excessively long.
[profile.dev]
opt-level = 3

[profile.release]
lto = true
